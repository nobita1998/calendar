<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binance Booster - Sentio 解锁</title>
  <link rel="icon" type="image/png" sizes="1024x1024" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #0c0c0f 0%, #1a1a23 100%);
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(23, 23, 31, 0.8);
      border-radius: 16px;
      border: 1px solid #2b2b40;
      backdrop-filter: blur(10px);
      padding: 30px;
      box-shadow: 0 20px 60px rgba(240, 185, 11, 0.1);
    }

    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }

    .title {
      font-size: 1.65em;
      font-weight: bold;
      background: linear-gradient(45deg, #f0b90b, #fcd535);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Reward cards */
    .rewards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .reward-card {
      background: linear-gradient(135deg, rgba(240, 185, 11, 0.1) 0%, rgba(23, 23, 31, 0.9) 100%);
      border: 1px solid #2b2b40;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .reward-card.guaranteed::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #f0b90b, #fcd535);
    }

    .reward-card.lottery {
      background: linear-gradient(135deg, rgba(38, 166, 154, 0.1) 0%, rgba(23, 23, 31, 0.9) 100%);
      border-color: rgba(38, 166, 154, 0.3);
    }

    .reward-card.lottery::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #26a69a, #1dd1a1);
    }

    .reward-emoji { font-size: 2.4em; margin-bottom: 10px; }
    .reward-title { font-weight: 700; font-size: 1.1em; margin-bottom: 6px; color: #ffffff; }
    .reward-subtitle { color: #848e9c; font-size: 0.85em; margin-bottom: 14px; }
    .reward-amount {
      font-size: 2em;
      font-weight: 700;
      color: #f0b90b;
      text-shadow: 0 0 20px rgba(240, 185, 11, 0.4);
    }
    .reward-card.lottery .reward-amount { color: #26a69a; text-shadow: 0 0 20px rgba(38, 166, 154, 0.4); }
    .reward-coin { font-size: 0.7em; color: #848e9c; margin-left: 6px; font-weight: 500; }
    .reward-usdt { display: block; color: #848e9c; font-size: 0.8em; margin-top: 8px; font-style: italic; font-weight: 400; }

    /* Summary */
    .summary-card {
      background: linear-gradient(135deg, rgba(240, 185, 11, 0.2) 0%, rgba(23, 23, 31, 0.9) 100%);
      border: 2px solid #f0b90b;
      border-radius: 8px;
      padding: 18px;
      text-align: center;
      position: relative;
      margin-bottom: 20px;
    }
    .summary-title { font-size: 1.1em; color: #f0b90b; margin-bottom: 8px; font-weight: 600; }
    .minimum-coins { font-size: 1.8em; font-weight: bold; color: #ffffff; text-shadow: 0 0 20px rgba(240, 185, 11, 0.8); margin-bottom: 8px; }
    .coin-symbol { color: #f0b90b; margin-left: 10px; }
    .summary-note { color: #848e9c; font-size: 0.85em; margin-top: 8px; font-style: italic; }

    .author-info {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      font-size: 0.75em;
    }
    .author-label { display: none; }
    .social-accounts { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
    .social-item { display: flex; align-items: center; gap: 4px; }
    .social-platform { color: #848e9c; }
    .social-handle { color: #f0b90b; font-weight: 600; }

    .watermark { text-align: right; color: #848e9c; font-size: 1em; opacity: 0.8; margin-top: 20px; padding-right: 10px; }

    /* Back link */
    .back-link {
      display: inline-block;
      background: linear-gradient(135deg, #0ecb81 0%, #1dd1a1 100%);
      color: #000;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(14,203,129,.3);
    }
    .back-link:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(14,203,129,.5); }

    @media (max-width: 768px) {
      body { padding: 10px; }
      .container { max-width: 100%; margin: 0; padding: 20px; }
      .title { font-size: 1.35em; }
      .rewards-grid { grid-template-columns: 1fr; gap: 14px; }
      .reward-card { padding: 20px; }
      .reward-amount { font-size: 1.7em; }
      .summary-card { padding: 14px; padding-top: 40px; }
      .author-info { top: 8px; right: 8px; font-size: 0.7em; }
      .back-link { padding: 6px 10px; font-size: 14px; }
      .summary-title { font-size: 1em; }
      .minimum-coins { font-size: 1.5em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html" class="back-link" aria-label="返回" onclick="if (document.referrer && new URL(document.referrer).origin === location.origin) { history.back(); return false; }">返回日历</a>
      <h1 class="title">Binance Booster - Sentio 解锁</h1>
    </div>

    <div class="rewards-grid" aria-label="每次解锁奖励">
      <div class="reward-card guaranteed" aria-label="保底奖励">
        <div class="reward-emoji">🪙</div>
        <div class="reward-title">每次保底</div>
        <div class="reward-subtitle">每次解锁必得</div>
        <div class="reward-amount">86.7<span class="reward-coin">币</span></div>
      </div>
      <div class="reward-card lottery" aria-label="抽奖奖励">
        <div class="reward-emoji">🎰</div>
        <div class="reward-title">抽奖中奖</div>
        <div class="reward-subtitle">中奖后额外奖励</div>
        <div class="reward-amount">13.3<span class="reward-coin">币</span></div>
      </div>
    </div>

    <div class="summary-card" aria-live="polite">
      <div class="summary-title">每次保底（Per Unlock Guaranteed）</div>
      <div class="minimum-coins">86.7<span class="coin-symbol">🪙</span></div>
      <div class="summary-note">抽奖中奖额外 +13.3 币，最高 100.0 币</div>
      <div class="author-info">
        <span class="author-label">作者：</span>
        <div class="social-accounts">
          <div class="social-item">
            <span class="social-platform">推特:</span>
            <span class="social-handle">@NNNNNNOBITA</span>
          </div>
          <div class="social-item">
            <span class="social-platform">币安广场:</span>
            <span class="social-handle">@NNNNNNobita</span>
          </div>
        </div>
      </div>
    </div>

    <div class="watermark">X: @NNNNNNOBITA</div>
  </div>

  <!-- i18n & title wiring -->
  <script>
    (function() {
      const LANG_STORAGE_KEY = 'calendar_lang';
      const currentLang = (function(){ try { return localStorage.getItem(LANG_STORAGE_KEY) || 'zh'; } catch(_){ return 'zh'; } })();
      const dict = {
        zh: {
          back: '返回日历',
          title: 'Binance Booster - Sentio 解锁',
          guaranteedTitle: '每次保底',
          guaranteedSub: '每次解锁必得',
          lotteryTitle: '抽奖中奖',
          lotterySub: '中奖后额外奖励',
          summaryTitle: '每次保底（Per Unlock Guaranteed）',
          summaryNote: '抽奖中奖额外 +13.3 币，最高 100.0 币',
          twitter: '推特:',
          binanceSquare: '币安广场:',
          coins: '币'
        },
        en: {
          back: 'Back to Calendar',
          title: 'Binance Booster - Sentio Unlock',
          guaranteedTitle: 'Guaranteed',
          guaranteedSub: 'Awarded every unlock',
          lotteryTitle: 'Lottery Bonus',
          lotterySub: 'Extra reward if won',
          summaryTitle: 'Per Unlock Guaranteed',
          summaryNote: 'Lottery adds +13.3 coins on win, up to 100.0 coins',
          twitter: 'Twitter:',
          binanceSquare: 'Binance Square:',
          coins: 'coins'
        }
      };

      function applyI18n(){
        try { document.documentElement.setAttribute('lang', currentLang === 'zh' ? 'zh-CN' : 'en-US'); } catch(_){ }
        const t = dict[currentLang];

        const h1 = document.querySelector('h1.title');
        if (h1) h1.textContent = t.title;
        try { document.title = t.title; } catch(_){ }

        const back = document.querySelector('.back-link');
        if (back) { back.textContent = t.back; back.setAttribute('aria-label', t.back); }

        const cards = document.querySelectorAll('.reward-card');
        if (cards.length >= 2) {
          cards[0].querySelector('.reward-title').textContent = t.guaranteedTitle;
          cards[0].querySelector('.reward-subtitle').textContent = t.guaranteedSub;
          cards[1].querySelector('.reward-title').textContent = t.lotteryTitle;
          cards[1].querySelector('.reward-subtitle').textContent = t.lotterySub;
        }

        document.querySelectorAll('.reward-coin').forEach(el => { el.textContent = t.coins; });

        const sumTitle = document.querySelector('.summary-title');
        if (sumTitle) sumTitle.textContent = t.summaryTitle;

        const sumNote = document.querySelector('.summary-note');
        if (sumNote) sumNote.textContent = t.summaryNote;

        const platforms = document.querySelectorAll('.social-platform');
        if (platforms.length >= 2) {
          platforms[0].textContent = t.twitter;
          platforms[1].textContent = t.binanceSquare;
        }
      }
      applyI18n();
    })();
  </script>

  <!-- Price annotation: STUSDT -->
  <script>
    (function(){
      const API = 'https://fapi.binance.com/fapi/v1/ticker/price?symbol=STUSDT';
      function fmt(n){ const v = Number(n); return isFinite(v) ? v.toFixed(2) : ''; }
      function lang(){ try { return localStorage.getItem('calendar_lang') || 'zh'; } catch(_){ return 'zh'; } }

      function appendUsd(el, coins, price){
        if (!el || !isFinite(coins) || !isFinite(price)) return;
        if (el.querySelector('.reward-usdt')) return;
        const span = document.createElement('span');
        span.className = 'reward-usdt';
        span.textContent = `≈ $${fmt(coins*price)} USDT`;
        el.appendChild(span);
      }

      function annotateSummary(price){
        const el = document.querySelector('.minimum-coins');
        if (!el || el.querySelector('.usd-suffix')) return;
        const m = (el.textContent||'').replace(/,/g,'').match(/([\d.]+)/);
        if (!m) return;
        const coins = parseFloat(m[1]);
        if (!isFinite(coins)) return;
        const span = document.createElement('span');
        span.className = 'usd-suffix';
        span.style.fontSize = '0.7em';
        span.style.marginLeft = '8px';
        span.style.color = '#f0b90b';
        span.textContent = (lang()==='en' ? ` ($${fmt(coins*price)} USDT)` : ` ≈$${fmt(coins*price)} USDT`);
        el.appendChild(span);
      }

      function annotate(price){
        if (!isFinite(price)) return;
        appendUsd(document.querySelectorAll('.reward-card')[0], 86.7, price);
        appendUsd(document.querySelectorAll('.reward-card')[1], 13.3, price);
        annotateSummary(price);
      }

      try {
        fetch(API).then(r=>r.json()).then(d=>{
          const p = parseFloat(d && (d.price||d.lastPrice));
          annotate(p);
        }).catch(()=>{});
      } catch(_) {}
    })();
  </script>

  <script src="scripts/analytics.js" defer></script>
</body>
</html>
